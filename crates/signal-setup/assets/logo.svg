<!--
  App icon for signal-setup. Matches Signal Desktop's macOS icon conventions:
    - 1024×1024 canvas with Apple's standard icon-grid margin
    - Squircle tile filled with Signal Ultramarine
    - White Signal mark inset inside the squircle
    - Smartphone glyph + diagonal strike inside the bubble

  All artwork (ring + bubble + phone + strike) is drawn in Signal's native
  128-unit coordinate system, then translated and uniformly scaled into the
  squircle. That keeps every element's relative size locked.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Phone clip in the 128-unit artwork space. -->
    <clipPath id="phone-clip">
      <rect x="42" y="29" width="44" height="70" rx="6"/>
    </clipPath>
  </defs>

  <!-- Squircle tile in Signal Ultramarine. ~10% margin from canvas edges. -->
  <rect x="100" y="100" width="824" height="824" rx="184" fill="#3340ff"/>

  <!-- Artwork: 128-unit space, scaled ×5, offset +192,+192 → fills 640×640 inside the squircle. -->
  <g transform="translate(192,192) scale(5)">
    <!-- Dashed outer ring -->
    <path fill="#ffffff" d="M64 0c3.32 0 6.582.253 9.766.74l-.916 5.931A58.5 58.5 0 0 0 64 6c-3.009 0-5.964.23-8.85.67L54.235.74A64.5 64.5 0 0 1 64 0m15.188 1.813-1.424 5.83a57.7 57.7 0 0 1 16.352 6.779l3.115-5.13a63.6 63.6 0 0 0-18.043-7.479m22.635 10.554-3.545 4.84a58.3 58.3 0 0 1 12.514 12.516l4.841-3.546a64.4 64.4 0 0 0-13.81-13.81m16.885 18.403-5.129 3.115a57.7 57.7 0 0 1 6.778 16.351l5.83-1.423a63.6 63.6 0 0 0-7.479-18.044Zm8.552 23.465-5.931.915A58.4 58.4 0 0 1 122 64c0 3.01-.229 5.965-.671 8.85l5.931.916c.487-3.184.74-6.446.74-9.766s-.253-6.581-.74-9.765m-13.681 39.881a57.7 57.7 0 0 0 6.778-16.352l5.83 1.424a63.6 63.6 0 0 1-7.48 18.043zm-2.787 4.162 4.841 3.546a64.4 64.4 0 0 1-13.81 13.809l-3.546-4.841a58.3 58.3 0 0 0 12.515-12.514m-16.677 15.301 3.116 5.129a63.6 63.6 0 0 1-18.044 7.479l-1.423-5.83a57.7 57.7 0 0 0 16.351-6.778m-21.265 7.75.915 5.931c-3.184.487-6.445.74-9.765.74s-6.582-.253-9.766-.74l.916-5.93c2.884.441 5.84.67 8.85.67a58.4 58.4 0 0 0 8.85-.671m-22.614-.971-1.424 5.829a63.5 63.5 0 0 1-13.823-5.125l-6.074 1.418-1.363-5.843 8.208-1.916 1.953.995a57.5 57.5 0 0 0 12.523 4.642m-27.748-2.54 1.363 5.843-10.411 2.43C6.51 127.707.293 121.489 1.91 114.56l2.429-10.411 5.843 1.363-2.43 10.412c-.606 2.598 1.726 4.93 4.324 4.324zm-11.125-17.37L5.52 99.085l1.418-6.074a63.6 63.6 0 0 1-5.125-13.824l5.829-1.423a57.6 57.6 0 0 0 4.642 12.523l.994 1.953zM6.67 72.85l-5.93.915A64.5 64.5 0 0 1 0 64c0-3.32.253-6.582.74-9.766l5.931.916A58.5 58.5 0 0 0 6 64c0 3.01.229 5.966.67 8.85m.973-22.614-5.83-1.424a63.6 63.6 0 0 1 7.48-18.043l5.129 3.115a57.7 57.7 0 0 0-6.779 16.352m9.565-20.513-4.84-3.546a64.4 64.4 0 0 1 13.809-13.81l3.546 4.84a58.3 58.3 0 0 0-12.515 12.515Zm16.677-15.302-3.116-5.129a63.6 63.6 0 0 1 18.044-7.48l1.423 5.83a57.7 57.7 0 0 0-16.351 6.78Z"/>
    <!-- Speech bubble -->
    <path fill="#ffffff" d="M116 64c0 28.719-23.281 52-52 52-9.11 0-17.672-2.342-25.117-6.457a3.3 3.3 0 0 0-2.351-.341L13.4 114.599l5.397-23.13a3.3 3.3 0 0 0-.34-2.352C14.341 81.671 12 73.109 12 64c0-28.719 23.281-52 52-52s52 23.281 52 52"/>
    <!-- Smartphone punched out of the bubble using the squircle's fill colour. -->
    <rect x="42" y="29" width="44" height="70" rx="6" fill="#3340ff"/>
    <!-- Home bar -->
    <rect x="56" y="91" width="16" height="4" rx="2" fill="#ffffff"/>
    <!-- Strike-through, clipped to the phone outline. Stroke is thin in 128-unit
         space because everything is scaled ×5 below. -->
    <line x1="42" y1="99" x2="86" y2="29" stroke="#ffffff" stroke-width="6" stroke-linecap="round" clip-path="url(#phone-clip)"/>
  </g>
</svg>
