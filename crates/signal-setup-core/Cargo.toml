[package]
name = "signal-setup-core"
description = "Signal account registration and device-linking core for signal-setup"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"] }
rustls = { version = "0.23", features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
rand_core_06 = { version = "0.6", package = "rand_core" }
base64 = "0.22"
x25519-dalek = { version = "2", features = ["static_secrets"] }
prost = "0.13"
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
thiserror = "2"
dirs = "5"

# Cross-OS native keyring for storing per-account secrets (passwords,
# identity key pairs, master and profile keys).
keyring-core = "1"

libsignal-protocol.workspace = true
tokio = { version = "1", features = ["rt", "macros"] }

[dev-dependencies]
xeddsa = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust", "vendored"] }
