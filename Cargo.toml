[workspace]
resolver = "2"
members = ["crates/signal-setup-core", "crates/signal-setup"]

[workspace.package]
version = "3.1.1"
authors = ["almet"]
edition = "2021"

# Signal Protocol (official Rust implementation) for session establishment
# and encrypted sync messages after device linking. Shared so both crates
# pin the same tag.
[workspace.dependencies]
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", tag = "v0.87.4" }

[patch.crates-io]
curve25519-dalek = { git = 'https://github.com/signalapp/curve25519-dalek', tag = 'signal-curve25519-4.1.3' }

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Enable Link Time Optimization
codegen-units = 1   # Better optimization, slower compile
strip = true        # Strip symbols from binary
panic = "abort"     # Reduce binary size by removing panic unwinding handlers
