name: Check Signal certs

on:
  schedule:
    - cron: '54 3 * * *' # at 3:54
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Detect signal cert changes
        id: detect-cert-change
        run: |
          set +e
          ./scripts/check-signal-cert.sh \
            --pinned signal-root.crt \
            --summary cert-change-summary.txt
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [[ $status -eq 0 ]]; then
            echo "Certificate is still the same"
          elif [[ $status -eq 2 ]]; then
            echo "Certificate change detected"
          else
            echo "Ooops! Status $status" >&2
            exit $status
          fi

      - name: Compute branch & fingerprint
        if: steps.detect-cert-change.outputs.status == '2'
        id: meta
        run: |
          fp=$(openssl x509 -in signal-root.crt -noout -fingerprint -sha256 | sed 's/^.*=//' | tr -d ':')
          short="${fp:0:12}"
          echo "branch=bot/signal-cert-${short}" >> "$GITHUB_OUTPUT"
          echo "short=${short}" >> "$GITHUB_OUTPUT"

      - name: Open PR with new cert
        if: steps.detect-cert-change.outputs.status == '2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.meta.outputs.branch }}
          SHORT: ${{ steps.meta.outputs.short }}
        run: |
          set -euo pipefail

          # If the branch already exists on the remote, a PR is already open
          # (or has been closed). Skip to keep the workflow idempotent.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists on origin — nothing to do."
            exit 0
          fi

          git config user.name  "cert-bump[bot]"
          git config user.email "cert-bump-bot@notmyidea.org"

          git checkout -b "$BRANCH"
          git add signal-root.crt
          git commit -m "Update signal servers certificate (${SHORT})"
          git push -u origin "$BRANCH"

          body_file=$(mktemp)
          {
            echo "Howdy! We detected that the certificate served by \`chat.signal.org\` no longer matches the one pinned by this repository."
            echo
            echo '```'
            cat cert-change-summary.txt
            echo '```'
            echo
            echo "You can verify the new certificate before merging with this command:"
            echo
            echo '```sh'
            echo "openssl x509 -in signal-root.crt -noout -subject -issuer -dates -fingerprint -sha256"
            echo "echo | openssl s_client -connect chat.signal.org:443 -servername chat.signal.org 2>/dev/null \\"
            echo "  | openssl x509 -noout -fingerprint -sha256"
            echo '```'
          } > "$body_file"

          gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "$BRANCH" \
            --title "Update signal servers certificate (${SHORT})" \
            --body-file "$body_file"
