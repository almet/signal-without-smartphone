name: Check Signal certs

# This job fails the day the servers present a certificate that no longer
# chains to it, which would mean the bundled CA must be replaced.

on:
  schedule:
    - cron: '54 3 * * *' # at 3:54
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify Signal servers against the pinned root CA
        run: ./scripts/check-signal-cert.sh --ca crates/signal-setup-core/signal-root-ca.crt
