name: Release Builds

on:
  push:
    tags:
      - 'v*'
  # Manual runs build the same assets from any branch and publish them as a
  # `preview-<branch>` prerelease, so users can try unreleased changes.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: signal-setup
            asset_name: signal-setup-linux-amd64
            appimage_arch: x86_64

          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: signal-setup
            asset_name: signal-setup-linux-arm64
            appimage_arch: aarch64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: signal-setup.exe
            asset_name: signal-setup-windows-amd64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev protobuf-compiler

      - name: Install Windows dependencies
        if: ${{ runner.os == 'Windows' }}
        run: choco install protoc --no-progress

      - name: Cache cargo registry
        if: ${{ runner.os != 'Windows' }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        if: ${{ runner.os != 'Windows' }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        if: ${{ runner.os != 'Windows' }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # Build the AppImage from the original binary name, before the rename
      - name: Package as AppImage
        if: ${{ runner.os == 'Linux' }}
        run: |
          mkdir -p dist
          packaging/linux/make-appimage.sh \
            "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" \
            "${{ matrix.appimage_arch }}" \
            dist

      - name: Upload AppImage artifact
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Signal_Setup-${{ matrix.appimage_arch }}.AppImage
          path: dist/Signal_Setup-${{ matrix.appimage_arch }}.AppImage

      - name: Rename binary
        if: ${{ runner.os != 'Windows' }}
        run: |
          mv target/${{ matrix.target }}/release/${{ matrix.artifact_name }} \
             target/${{ matrix.target }}/release/${{ matrix.asset_name }}

      - name: Rename binary (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: Move-Item -Path "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" -Destination "target/${{ matrix.target }}/release/${{ matrix.asset_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.asset_name }}

  build-macos:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Intel, cross-compiled
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: signal-setup-macos-intel.dmg

          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: signal-setup-macos-silicon.dmg

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y \
            --default-toolchain stable \
            --no-modify-path
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
          rustup target add ${{ matrix.target }}

      - name: Install macOS dependencies
        run: brew install protobuf

      - name: Cache cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package as .app + .dmg
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-$(git rev-parse --short HEAD)"
          fi
          mkdir -p dist
          packaging/macos/make-app.sh \
            "target/${{ matrix.target }}/release/signal-setup" \
            "$version" \
            dist

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  create-release:
    name: Create Release
    if: github.event_name == 'push'
    needs: [build, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: List artifacts
        run: ls -R artifacts/

      - name: Extract changelog section for this tag
        id: changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Pull the first section of the CHANGELOG
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::No CHANGELOG.md section found for version $version"
          fi
          echo "--- release notes ---"
          cat release-notes.md
          echo "--- end ---"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: artifacts/*/*
          draft: false
          prerelease: false
          body_path: release-notes.md
          append_body: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-preview:
    name: Publish Preview Release
    if: github.event_name == 'workflow_dispatch'
    needs: [build, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Publish prerelease for this branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="preview-$(echo "$GITHUB_REF_NAME" | tr '/' '-')"

          # Each branch gets a single moving prerelease: drop the previous
          # one (and its tag) so the release always matches the latest run.
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true

          {
            echo "Automated preview build of branch \`$GITHUB_REF_NAME\` at commit $GITHUB_SHA."
            echo ""
            echo "These assets exist so unreleased changes can be tried out; expect rough edges."
            echo "For daily use, grab the [latest stable release](https://github.com/$GITHUB_REPOSITORY/releases/latest) instead."
          } > notes.md

          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Preview build: $GITHUB_REF_NAME" \
            --notes-file notes.md \
            artifacts/*/*
